name: Agent Harness

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

# Fork pull requests run untrusted code, so they stay on GitHub-hosted runners.
# Each RunsOn label embeds run id, attempt, and job name so jobs never share runners.
jobs:
  check:
    name: Check agent rules and invariants
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || format('runs-on={0}-{1}-{2}/runner=2cpu-linux-x64', github.run_id, github.run_attempt, github.job) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Check shell syntax
        run: bash -n scripts/agent-format-hook.sh scripts/check-committee.sh scripts/check-doc-sync.sh scripts/check-invariants.sh

      - name: Check harness documentation sync
        env:
          DOC_SYNC_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/check-doc-sync.sh

      - name: Check mechanical invariants
        run: ./scripts/check-invariants.sh

      - name: Check committee configuration
        run: ./scripts/check-committee.sh
